<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Table</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background-color: #f8f9fa;
  }

  table {
    width: 80%;
    border-collapse: collapse;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    background: white;
  }

  th, td {
    border: 1px solid #ccc;
    text-align: left;
    padding: 12px;
  }

  th {
    background-color: #4CAF50;
    color: white;
    text-align: center;
  }

  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  tr:hover {
    background-color: #e0f7e0;
  }

  caption {
    caption-side: top;
    font-weight: bold;
    font-size: 1.2em;
    margin-bottom: 10px;
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background-color: #45a049;
  }

  .status {
    font-weight: bold;
    text-align: center;
  }

  .present {
    color: green;
  }

  .absent {
    color: red;
  }
</style>
</head>
<body>

<table>
  <caption>Student Attendance Record</caption>
  <thead>
    <tr>
      <th>Student Name</th>
      <th>Course</th>
      <th>Attendance</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Sedem Doku</td>
      <td>Computer Science</td>
      <td><button onclick="recordAttendance(this)">Record Attendance</button></td>
      <td class="status">-</td>
    </tr>
    <tr>
      <td>Amma Mensah</td>
      <td>Economics</td>
      <td><button onclick="recordAttendance(this)">Record Attendance</button></td>
      <td class="status">-</td>
    </tr>
    <tr>
      <td>Kofi Boateng</td>
      <td>Statistics</td>
      <td><button onclick="recordAttendance(this)">Record Attendance</button></td>
      <td class="status">-</td>
    </tr>
  </tbody>
</table>

<script>
  function recordAttendance(button) {
    // Ask for attendance
    const status = prompt("Enter attendance status: Present (P) or Absent (A)").toLowerCase();

    // Get the row and status cell
    const row = button.closest("tr");
    const statusCell = row.querySelector(".status");

    if (status === "p" || status === "present") {
      statusCell.textContent = "Present";
      statusCell.className = "status present";
    } else if (status === "a" || status === "absent") {
      statusCell.textContent = "Absent";
      statusCell.className = "status absent";
    } else {
      alert("Invalid input! Please enter 'P' or 'A'.");
    }
  }
</script>

</body>
</html>
